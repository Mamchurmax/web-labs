<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Order a Permit</title>
    <link rel="stylesheet" href="read_page.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="background-container">
</div>
<header class="header">

    <a href="../../landing_page/index.html"> <img class="logo" src="../assets/imgs/logologo.svg" alt="logo"></a>

    <nav>

        <a href="">ABOUT</a>
        <a href="">HOW TO</a>
        <a href="">FAQS</a>
        <a class="contact-btn" href="">CONTACT US</a>

    </nav>
    <div class="hamburger" >
        <div id="line1"></div>
        <div id="line2"></div>
        <div id="line3"></div>
    </div>

</header>
<main>
    <section class="section-menu">
        <div id="createPopup" class="overlay">
            <div class="popup">
                <div class="popup__panel">
                    <h2>Create a Permit</h2>
                    <button class="close">&times;</button>
                </div>
                <div class="content">
                    <form class="create-form" onsubmit="return false">
                        <p id="id-modal" style="display: none"></p>
                        <label>
                            <span>Title</span>
                            <input required type="text" placeholder="Text..." class="title-create-input" maxlength="25" id="title-modal">
                        </label>
                        <label>
                            <span>Description</span>
                            <textarea maxlength="30" required class="description-create-input" id="description-modal"></textarea>
                        </label>
                        <label>
                            <span>Price ($)</span>
                            <input required id="price-modal" type="number" min="0" placeholder="Number..." class="price-create-input">
                        </label>
                        <!--                        <label>-->
                        <!--                            <input type="file" id="image-modal" accept=".jpg, .jpeg, .png">-->
                        <!--                            <span class="error"></span>-->
                        <!--                        </label>-->
                        <label>
                            <button class="create-modal-button" type="submit" id="submit-create-button">Submit</button>
                        </label>
                    </form>
                </div>
            </div>
        </div>
        <div class="create">
            <a class="create-button" href="#" id="create-button">Order a permit</a>
        </div>
        <div class="search-menu" id="search-menu">
            <form id="search-form">
                <label class="input-buttons-menu">
                    <input placeholder="Type something..." id="search-value">
                    <label class="buttons-menu">
                        <button type="submit" class="search" id="search-button"><span>Search</span><img src="../assets/imgs/Search_button.svg" alt="Search"></button>
                        <button type="reset" class="clear" id="reset-button"><span>Clear</span><img src="../assets/imgs/clear_button.svg" alt="Clear"></button>
                    </label>
                </label>
            </form>
        </div>
    </section>
    <section class="section-items">
        <div class="item-manager">
            <div class="sort-div">
                <h1>Manage Permits</h1>
                <form>
                    <label for="sort"> Sort by: </label>
                    <select class="sort-select" name="sort" id="sort">
                        <option value="" selected disabled hidden>Choose one...</option>
                        <option value="price:ASC">Price(Low to High)</option>
                        <option value="from_to:ASC">Name A-Z</option>
                        <option value="from_to:DESC">Name Z-A</option>
                    </select>
                </form>
            </div>
            <hr>
            <div class="count-div">
                <h2>Count price</h2>
                <form>
                    <label>
                        <button type="submit" class="item-count-button" id="item-count">Count</button>
                        <output>Total: <span id="total-price"></span></output>
                    </label>
                </form>
            </div>
        </div>

        <div id="ItemsWrappper" class="items-wrapper">
        </div>
        <template class="item-template" id="item-template">
            <div class="item" id="item">
                <p id="id" style="display: none"></p>
                <div class="picture"></div>
                <div class="info">
                    <h3 class="h3" id="title">some text</h3>
                    <h4 class="h6" id="description">some text2</h4>
                    <h6 class="h6" id="price"></h6>
                </div>
                <div class="manage">
                    <button class="edit-permit">Edit</button>
                    <button class="remove-permit" id="delete-button">Remove</button>
                </div>
            </div>
        </template>
    </section>

</main>
